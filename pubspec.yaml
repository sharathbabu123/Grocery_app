name: grocery_inventory_app
description: A simple Flutter app for capturing video and detecting food items.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.2
  tflite_flutter: ^0.11.0
  image: ^4.2.0
  intl: ^0.19.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/models/grocery_model.tflite
    - assets/labels.txt
